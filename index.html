<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colección Plushie</title>
  
  <!-- Unique Typography from Google Fonts (Avoiding generic AI fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Epilogue:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Three.js Background Engine -->
  <div id="webgl-canvas-container"></div>

  <!-- Noise Texture Overlay for Visual Depth -->
  <div class="noise-overlay"></div>

  <!-- Minimalist High-End UI -->
  <main class="ui-layer">
    
    <!-- Header -->
    <header class="header reveal-1">
      <div class="brand">
        <span class="brand-icon">✧</span>
        <span class="brand-text">PALS</span>
      </div>
      <nav class="nav-links">
        <a href="#collection">Colección</a>
        <a href="#about">Filosofía</a>
        <a href="#contact" class="nav-btn">Adoptar</a>
      </nav>
    </header>

    <!-- Hero Content (Asymmetrical Layout) -->
    <section class="hero-content">
      <div class="title-wrapper">
        <p class="eyebrow reveal-2">Cápsula Primavera 2026</p>
        <h1 class="main-title reveal-3">
          Suavidad,<br>
          <span class="italic">Reimaginada.</span>
        </h1>
      </div>

      <div class="description-wrapper reveal-4">
        <p class="description">
          Una selección minimalista de compañeros ultra suaves y abrazables, diseñados con precisión, empatía y un refinamiento estético inigualable.
        </p>
        <button class="cta-btn">
          Explorar el Sueño
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
        </button>
      </div>
    </section>

    <!-- Footer Meta -->
    <footer class="footer-meta reveal-5">
      <div class="meta-item">
        <span class="meta-label">Edición</span>
        <span class="meta-value">01 / Original</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Experiencia</span>
        <span class="meta-value">WebGL Interactivo</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Estado</span>
        <span class="meta-value"><span class="status-dot"></span> Disponible</span>
      </div>
    </footer>

  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
